<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>The Hungering Dark</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/addons/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud"></div>
  <div id="overlays"></div>
  <div id="tip"></div>
  <div id="toast"></div>
  <div id="flash"></div>
  <div id="boot">
    <h1>The Hungering Dark</h1>
    <p>Something stirs in the circle...</p>
  </div>
  <script>
    // ES modules do not load from file:// pages. Explain instead of showing a blank screen.
    setTimeout(function () {
      if (window.__booted) return;
      var b = document.getElementById('boot');
      if (b && location.protocol === 'file:') b.innerHTML = '<h1>The Hungering Dark</h1><p>This game must be served over http.<br>In this folder run <code>python3 -m http.server</code><br>then open <code>http://localhost:8000</code>.</p>';
    }, 2500);
  </script>
</body>
</html>
